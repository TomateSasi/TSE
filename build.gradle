plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
}

loom {
    runtimeOnlyLog4j
}

group = 'de.tomate'
version = '2.0'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url "https://maven.shedaniel.me/" }
    mavenCentral()
    gradlePluginPortal()
}

configurations {
    shade
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.158.0+26.2"

    shade "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    shade "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    shade "com.googlecode.soundlibs:tritonus-share:0.3.7.4"

    implementation "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    implementation "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    implementation "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
}

shadowJar {
    configurations = [project.configurations.shade]
    mergeServiceFiles()
    archiveClassifier = ''
}

assemble.dependsOn shadowJar

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
